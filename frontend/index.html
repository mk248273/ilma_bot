<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILMA AI - Your Academic Assistant</title>
    <meta http-equiv="refresh" content="0;url=/landing.html">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%); min-height: 100vh; }
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex items-center justify-center">
    <div class="text-center">
        <div class="loader mx-auto mb-4"></div>
        <p class="text-gray-400">Loading ILMA AI...</p>
        <p class="text-gray-500 text-sm mt-2">If not redirected, <a href="/landing.html" class="text-indigo-400 hover:underline">click here</a></p>
    </div>
</body>
</html>
