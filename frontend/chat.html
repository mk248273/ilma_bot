<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | ILMA AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.3/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar-item { transition: all 0.2s; }
        .sidebar-item:hover { background: rgba(255,255,255,0.05); }
        .sidebar-item.active { background: rgba(99, 102, 241, 0.2); border-left: 3px solid #6366f1; }
        .message-bubble { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .code-block { position: relative; }
        .copy-btn { 
            position: absolute; top: 8px; right: 8px; 
            padding: 4px 8px; background: rgba(255,255,255,0.1); 
            border-radius: 6px; font-size: 12px; cursor: pointer;
            opacity: 0; transition: opacity 0.2s;
        }
        .code-block:hover .copy-btn { opacity: 1; }
        .typing-dot { animation: typing 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .input-container:focus-within { box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3); }
        pre { background: #1e293b; border-radius: 8px; padding: 16px; overflow-x: auto; margin: 8px 0; }
        code { font-family: 'Consolas', 'Monaco', monospace; font-size: 14px; }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 { margin: 16px 0 8px; font-weight: 600; }
        .markdown-content p { margin: 8px 0; line-height: 1.6; }
        .markdown-content ul, .markdown-content ol { margin: 8px 0; padding-left: 24px; }
        .markdown-content li { margin: 4px 0; }
        .markdown-content table { border-collapse: collapse; margin: 12px 0; }
        .markdown-content th, .markdown-content td { border: 1px solid rgba(255,255,255,0.1); padding: 8px 12px; }
        .markdown-content th { background: rgba(255,255,255,0.05); }
    </style>
</head>
<body class="gradient-bg text-white h-screen overflow-hidden">
    <!-- Mobile Menu Button -->
    <button id="mobileMenuBtn" class="md:hidden fixed top-4 left-4 z-50 p-2 glass rounded-lg">
        <i data-lucide="menu" class="w-6 h-6"></i>
    </button>

    <div class="flex h-full">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-80 glass border-r border-white/5 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 fixed md:relative z-40 h-full">
            <!-- Header -->
            <div class="p-4 border-b border-white/5">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
                        <i data-lucide="graduation-cap" class="w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg">ILMA AI</h1>
                        <div class="flex items-center gap-1 text-xs text-green-400">
                            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                            Online
                        </div>
                    </div>
                </div>
                <button onclick="newChat()" class="w-full py-3 px-4 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl flex items-center gap-2 transition">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    <span>New Chat</span>
                </button>
            </div>

            <!-- Search -->
            <div class="px-4 py-2">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-gray-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="searchChats" placeholder="Search conversations..." 
                        class="w-full bg-white/5 border border-white/10 rounded-lg pl-9 pr-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500/50"
                        oninput="filterHistory()">
                </div>
            </div>

            <!-- Chat History -->
            <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1 scrollbar-hide" id="historyList">
                <!-- Sessions loaded dynamically -->
                <div class="text-center text-gray-500 py-8 text-sm">Loading chats...</div>
            </div>

            <!-- User Profile -->
            <div class="p-4 border-t border-white/5">
                <div class="flex items-center gap-3 mb-3">
                    <div id="userAvatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-gray-600 to-gray-700 flex items-center justify-center text-lg">
                        👤
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-medium truncate" id="userName">Student</div>
                        <div class="text-xs text-gray-400 truncate" id="userDept">-</div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <a href="/admin.html" id="adminLink" class="hidden py-2 px-3 bg-white/5 hover:bg-white/10 rounded-lg text-sm flex items-center justify-center gap-1 transition">
                        <i data-lucide="shield" class="w-4 h-4"></i>
                        Admin
                    </a>
                    <button onclick="logout()" class="py-2 px-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg text-sm flex items-center justify-center gap-1 transition col-span-2">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                        Logout
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col h-full relative">
            <!-- Chat Header -->
            <header class="h-16 glass border-b border-white/5 flex items-center justify-between px-4 md:px-6">
                <div class="flex items-center gap-3">
                    <span class="text-sm text-gray-400" id="currentSessionTitle">New Conversation</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="toggleTheme()" class="p-2 hover:bg-white/5 rounded-lg transition">
                        <i data-lucide="moon" class="w-5 h-5 text-gray-400"></i>
                    </button>
                </div>
            </header>

            <!-- Messages -->
            <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 md:p-6 scrollbar-hide">
                <!-- Welcome Screen -->
                <div id="welcomeScreen" class="flex flex-col items-center justify-center h-full text-center">
                    <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center mb-6 animate-bounce">
                        <i data-lucide="sparkles" class="w-10 h-10 text-white"></i>
                    </div>
                    <h2 class="text-3xl font-bold mb-3">How can I help you today?</h2>
                    <p class="text-gray-400 max-w-md mb-8">Ask me anything about ILMA University - admissions, programs, campus life, and more.</p>
                    
                    <div class="grid md:grid-cols-2 gap-3 max-w-lg w-full">
                        <button onclick="quickPrompt('What are the admission requirements for BS Computer Science?')" class="p-4 glass rounded-xl text-left hover:bg-white/5 transition text-sm">
                            <i data-lucide="book-open" class="w-5 h-5 text-indigo-400 mb-2"></i>
                            <div class="font-medium">Admissions</div>
                            <div class="text-gray-400 text-xs">Requirements & deadlines</div>
                        </button>
                        <button onclick="quickPrompt('Tell me about the Computer Science department.')" class="p-4 glass rounded-xl text-left hover:bg-white/5 transition text-sm">
                            <i data-lucide="building" class="w-5 h-5 text-purple-400 mb-2"></i>
                            <div class="font-medium">Departments</div>
                            <div class="text-gray-400 text-xs">Programs & faculty</div>
                        </button>
                        <button onclick="quickPrompt('What facilities are available on campus?')" class="p-4 glass rounded-xl text-left hover:bg-white/5 transition text-sm">
                            <i data-lucide="map-pin" class="w-5 h-5 text-green-400 mb-2"></i>
                            <div class="font-medium">Campus Life</div>
                            <div class="text-gray-400 text-xs">Facilities & location</div>
                        </button>
                        <button onclick="quickPrompt('What scholarships are available?')" class="p-4 glass rounded-xl text-left hover:bg-white/5 transition text-sm">
                            <i data-lucide="award" class="w-5 h-5 text-yellow-400 mb-2"></i>
                            <div class="font-medium">Scholarships</div>
                            <div class="text-gray-400 text-xs">Financial aid info</div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 border-t border-white/5">
                <div class="max-w-4xl mx-auto">
                    <!-- Attached File Preview -->
                    <div id="filePreview" class="hidden mb-3 p-3 glass rounded-xl flex items-center gap-3">
                        <i data-lucide="image" class="w-5 h-5 text-indigo-400"></i>
                        <span class="flex-1 truncate text-sm" id="fileName"></span>
                        <button onclick="clearFile()" class="p-1 hover:bg-white/10 rounded">
                            <i data-lucide="x" class="w-4 h-4 text-gray-400"></i>
                        </button>
                    </div>

                    <div class="input-container flex items-end gap-3 p-3 glass rounded-2xl bg-white/5 border border-white/10 transition">
                        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(this)">
                        <button onclick="document.getElementById('fileInput').click()" class="p-2 hover:bg-white/10 rounded-xl transition text-gray-400 hover:text-white">
                            <i data-lucide="image-plus" class="w-5 h-5"></i>
                        </button>
                        
                        <div class="flex-1">
                            <textarea 
                                id="messageInput" 
                                rows="1"
                                placeholder="Message ILMA AI..."
                                class="w-full bg-transparent resize-none outline-none text-white placeholder-gray-500 max-h-32"
                                onkeydown="handleKeyDown(event)"
                                oninput="autoResize(this)"
                            ></textarea>
                        </div>

                        <button 
                            id="sendBtn"
                            onclick="sendMessage()"
                            class="p-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 rounded-xl transition disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            <i data-lucide="send" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div class="text-center mt-2">
                        <p class="text-xs text-gray-500">Powered by Gemini 2.0 Flash • Responses are AI-generated</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Rename Modal -->
    <div id="renameModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="glass rounded-2xl p-6 w-full max-w-md mx-4">
            <h3 class="text-xl font-semibold mb-4">Rename Conversation</h3>
            <input type="text" id="renameInput" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white mb-4 focus:outline-none focus:border-indigo-500/50" placeholder="Enter new title">
            <div class="flex justify-end gap-3">
                <button onclick="closeRenameModal()" class="px-4 py-2 text-gray-400 hover:text-white transition">Cancel</button>
                <button onclick="confirmRename()" class="px-4 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-lg">Save</button>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        lucide.createIcons();

        // Check auth
        if (!localStorage.getItem('token')) {
            window.location.href = '/login.html';
        }

        let activeSessionId = null;
        let currentStream = null;
        let renamingSessionId = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadUserInfo();
            loadHistory();
            
            // Mobile menu toggle
            document.getElementById('mobileMenuBtn').addEventListener('click', () => {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('-translate-x-full');
            });
        });

        function loadUserInfo() {
            const username = localStorage.getItem('username') || 'Student';
            const profile_image = localStorage.getItem('profile_image');
            const is_admin = localStorage.getItem('is_admin') === 'true';
            
            document.getElementById('userName').textContent = username;
            
            if (profile_image) {
                document.getElementById('userAvatar').innerHTML = `<img src="/${profile_image}" class="w-full h-full rounded-full object-cover">`;
            } else {
                document.getElementById('userAvatar').textContent = username.charAt(0).toUpperCase();
            }

            if (is_admin) {
                document.getElementById('adminLink').classList.remove('hidden');
                document.getElementById('adminLink').classList.add('flex');
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 128) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                document.getElementById('fileName').textContent = input.files[0].name;
                document.getElementById('filePreview').classList.remove('hidden');
            }
        }

        function clearFile() {
            document.getElementById('fileInput').value = '';
            document.getElementById('filePreview').classList.add('hidden');
        }

        function quickPrompt(text) {
            document.getElementById('messageInput').value = text;
            sendMessage();
        }

        function newChat() {
            activeSessionId = null;
            document.getElementById('messagesContainer').innerHTML = `
                <div id="welcomeScreen" class="flex flex-col items-center justify-center h-full text-center">
                    <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center mb-6">
                        <i data-lucide="sparkles" class="w-10 h-10 text-white"></i>
                    </div>
                    <h2 class="text-3xl font-bold mb-3">How can I help you today?</h2>
                    <p class="text-gray-400 max-w-md mb-8">Ask me anything about ILMA University</p>
                </div>
            `;
            document.getElementById('currentSessionTitle').textContent = 'New Conversation';
            lucide.createIcons();
            loadHistory();
            
            // Close mobile sidebar
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!message && !file) return;

            // Hide welcome screen
            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            // Add user message
            addMessage('user', message, file ? URL.createObjectURL(file) : null);
            
            // Clear input
            input.value = '';
            input.style.height = 'auto';
            clearFile();

            // Add typing indicator
            const botMsg = addTypingIndicator();
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;

            // Send to API
            const formData = new FormData();
            formData.append('message', message);
            if (activeSessionId) formData.append('session_id', activeSessionId);
            if (file) formData.append('file', file);

            try {
                const response = await fetch('/chat/send', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                    body: formData
                });

                if (!response.ok) throw new Error('Failed to send message');

                const sessionId = response.headers.get('X-Session-ID');
                if (sessionId) {
                    activeSessionId = sessionId;
                    document.getElementById('currentSessionTitle').textContent = message.slice(0, 30) + (message.length > 30 ? '...' : '');
                }

                // Stream response
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                let contentDiv = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                
                                // Remove typing indicator on first chunk
                                if (!contentDiv) {
                                    botMsg.innerHTML = '';
                                    const bubble = createMessageBubble('bot', '');
                                    botMsg.appendChild(bubble);
                                    contentDiv = bubble.querySelector('.message-content');
                                }
                                
                                fullText += data.text;
                                
                                // Render markdown
                                let html = fullText;
                                if (window.marked) {
                                    html = marked.parse(fullText);
                                }
                                if (window.DOMPurify) {
                                    html = DOMPurify.sanitize(html);
                                }
                                
                                contentDiv.innerHTML = html;
                                
                                // Highlight code blocks
                                contentDiv.querySelectorAll('pre code').forEach((block) => {
                                    hljs.highlightElement(block);
                                });
                                
                                // Add copy buttons to code blocks
                                addCopyButtons(contentDiv);
                                
                                container.scrollTop = container.scrollHeight;
                            } catch (e) {}
                        }
                    }
                }

                loadHistory();

            } catch (error) {
                botMsg.innerHTML = `<div class="p-4 text-red-400">Error: ${error.message}</div>`;
            }
        }

        function addMessage(role, content, imageUrl = null) {
            const container = document.getElementById('messagesContainer');
            const bubble = createMessageBubble(role, content, imageUrl);
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
            lucide.createIcons();
        }

        function createMessageBubble(role, content, imageUrl = null) {
            const div = document.createElement('div');
            div.className = `message-bubble flex gap-4 mb-6 ${role === 'user' ? 'flex-row-reverse' : ''}`;
            
            const avatar = role === 'bot' 
                ? `<div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shrink-0"><i data-lucide="bot" class="w-5 h-5 text-white"></i></div>`
                : `<div class="w-8 h-8 rounded-full bg-gradient-to-br from-gray-600 to-gray-700 flex items-center justify-center shrink-0 text-sm font-bold">${localStorage.getItem('username')?.charAt(0).toUpperCase() || 'U'}</div>`;
            
            let contentHtml = `<div class="message-content markdown-content text-sm leading-relaxed">${content}</div>`;
            if (imageUrl) {
                contentHtml += `<img src="${imageUrl}" class="mt-2 max-w-xs rounded-xl border border-white/10">`;
            }
            
            div.innerHTML = `
                ${avatar}
                <div class="flex-1 ${role === 'user' ? 'text-right' : ''}">
                    <div class="inline-block ${role === 'user' ? 'bg-indigo-600/30 border border-indigo-500/30' : 'glass'} rounded-2xl px-4 py-3 max-w-3xl">
                        ${contentHtml}
                    </div>
                </div>
            `;
            
            return div;
        }

        function addTypingIndicator() {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.className = 'message-bubble flex gap-4 mb-6';
            div.innerHTML = `
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shrink-0">
                    <i data-lucide="bot" class="w-5 h-5 text-white"></i>
                </div>
                <div class="glass rounded-2xl px-4 py-3">
                    <div class="flex gap-1">
                        <span class="w-2 h-2 bg-indigo-400 rounded-full typing-dot"></span>
                        <span class="w-2 h-2 bg-indigo-400 rounded-full typing-dot"></span>
                        <span class="w-2 h-2 bg-indigo-400 rounded-full typing-dot"></span>
                    </div>
                </div>
            `;
            container.appendChild(div);
            return div;
        }

        function addCopyButtons(container) {
            container.querySelectorAll('pre').forEach(pre => {
                if (!pre.querySelector('.copy-btn')) {
                    const btn = document.createElement('button');
                    btn.className = 'copy-btn';
                    btn.innerHTML = '<span>Copy</span>';
                    btn.onclick = () => {
                        const code = pre.querySelector('code')?.textContent || pre.textContent;
                        navigator.clipboard.writeText(code);
                        btn.innerHTML = '<span>Copied!</span>';
                        setTimeout(() => btn.innerHTML = '<span>Copy</span>', 2000);
                    };
                    pre.appendChild(btn);
                }
            });
        }

        async function loadHistory() {
            try {
                const res = await fetch('/chat/history', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                
                if (!res.ok) return;
                
                const sessions = await res.json();
                const list = document.getElementById('historyList');
                list.innerHTML = '';
                
                if (sessions.length === 0) {
                    list.innerHTML = '<div class="text-center text-gray-500 py-8 text-sm">No conversations yet</div>';
                    return;
                }
                
                sessions.forEach(session => {
                    const title = session.session_title || session.content.slice(0, 30) + (session.content.length > 30 ? '...' : '');
                    const isActive = session.session_id === activeSessionId;
                    
                    const div = document.createElement('div');
                    div.className = `sidebar-item p-3 rounded-lg cursor-pointer group ${isActive ? 'active' : ''}`;
                    div.innerHTML = `
                        <div class="flex items-center gap-3">
                            <i data-lucide="message-square" class="w-4 h-4 text-gray-400"></i>
                            <span class="flex-1 truncate text-sm">${title}</span>
                            <button onclick="event.stopPropagation(); openRenameModal('${session.session_id}', '${title.replace(/'/g, "\\'")}')" class="opacity-0 group-hover:opacity-100 p-1 hover:bg-white/10 rounded transition">
                                <i data-lucide="pencil" class="w-3 h-3 text-gray-400"></i>
                            </button>
                            <button onclick="event.stopPropagation(); deleteSession('${session.session_id}')" class="opacity-0 group-hover:opacity-100 p-1 hover:bg-red-500/20 rounded transition">
                                <i data-lucide="trash-2" class="w-3 h-3 text-red-400"></i>
                            </button>
                        </div>
                    `;
                    div.onclick = () => loadSession(session.session_id);
                    list.appendChild(div);
                });
                
                lucide.createIcons();
            } catch (e) {}
        }

        async function loadSession(sessionId) {
            activeSessionId = sessionId;
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '<div class="flex justify-center py-8"><div class="w-8 h-8 border-2 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin"></div></div>';
            
            try {
                const res = await fetch(`/chat/session/${sessionId}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                
                if (!res.ok) throw new Error('Failed to load session');
                
                const messages = await res.json();
                container.innerHTML = '';
                
                messages.forEach(msg => {
                    addMessage(msg.role, msg.content);
                });
                
                document.getElementById('currentSessionTitle').textContent = 
                    messages[0]?.content.slice(0, 30) + (messages[0]?.content.length > 30 ? '...' : '') || 'Conversation';
                
                // Close mobile sidebar
                if (window.innerWidth < 768) {
                    document.getElementById('sidebar').classList.add('-translate-x-full');
                }
                
                loadHistory();
            } catch (error) {
                container.innerHTML = `<div class="text-center text-red-400">Error loading conversation</div>`;
            }
        }

        function filterHistory() {
            const search = document.getElementById('searchChats').value.toLowerCase();
            const items = document.querySelectorAll('#historyList .sidebar-item');
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(search) ? '' : 'none';
            });
        }

        async function deleteSession(sessionId) {
            if (!confirm('Delete this conversation?')) return;
            
            try {
                const res = await fetch(`/chat/session/${sessionId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                
                if (res.ok) {
                    if (activeSessionId === sessionId) newChat();
                    else loadHistory();
                }
            } catch (e) {}
        }

        function openRenameModal(sessionId, currentTitle) {
            renamingSessionId = sessionId;
            document.getElementById('renameInput').value = currentTitle;
            document.getElementById('renameModal').classList.remove('hidden');
            document.getElementById('renameModal').classList.add('flex');
        }

        function closeRenameModal() {
            document.getElementById('renameModal').classList.add('hidden');
            document.getElementById('renameModal').classList.remove('flex');
            renamingSessionId = null;
        }

        async function confirmRename() {
            if (!renamingSessionId) return;
            
            const newTitle = document.getElementById('renameInput').value.trim();
            if (!newTitle) return;
            
            try {
                const formData = new FormData();
                formData.append('title', newTitle);
                
                await fetch(`/chat/session/${renamingSessionId}`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
                    body: formData
                });
                
                loadHistory();
                closeRenameModal();
            } catch (e) {}
        }

        function toggleTheme() {
            // Theme toggle functionality can be added here
            showToast('Theme toggle coming soon!');
        }

        function showToast(message) {
            // Simple toast implementation
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg z-50';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
